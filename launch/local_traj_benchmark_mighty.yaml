session_name: docker_mighty_sim
windows:
  - window_name: main
    layout: tiled
    shell_command_before:
    - source /home/kkondo/code/mighty_ws/install/setup.bash
    - source /home/kkondo/code/decomp_ws/install/setup.bash
    - export ROS_DOMAIN_ID=7
    panes:
      # base station
      - shell_command:
        - source /usr/share/gazebo/setup.bash
        - ros2 launch mighty base_mighty.launch.py use_dyn_obs:=false use_gazebo_gui:=false use_rviz:=true env:=simple_box #big_obstacle 
     
      # ACL mapper
      - shell_command:
        - sleep 10
        - ros2 launch global_mapper_ros global_mapper_node.launch.py world_dimensions:="[60.0, 30.0, 10.0]"

      # onboard agent NX01
      - shell_command:
        - sleep 10
        - ros2 launch mighty onboard_mighty_benchmark.launch.py x:=-2.0 y:=0.0 z:=1.0 yaw:=1.57

      - shell_command:
        - sleep 20
        - |
          ros2 topic pub /NX01/goal dynus_interfaces/msg/Goal "{
            header: {stamp: {sec: 0, nanosec: 0}, frame_id: 'map'},
            p: {x: 2.0, y: 0.0, z: 1.0},
            v: {x: 0.5, y: 0.0, z: 0.0},
            a: {x: 0.0, y: 0.0, z: 0.0},
            j: {x: 0.0, y: 0.0, z: 0.0},
            yaw: 0.0,
            dyaw: 0.0
          }"

      - shell_command:
        - sleep 30
        - ros2 launch mighty local_traj_benchmark_mighty.launch.py output_file_id:=simple_boxv5_occ