session_name: info_gain_analysis
windows:
  - window_name: main
    layout: tiled
    shell_command_before:
    - source /home/kkondo/code/mighty_ws/install/setup.bash
    - source /home/kkondo/code/decomp_ws/install/setup.bash
    - export ROS_DOMAIN_ID=7
    panes:
      # base station
      - shell_command:
        - source /usr/share/gazebo/setup.bash
        - ros2 launch mighty base_mighty.launch.py use_dyn_obs:=false use_gazebo_gui:=false use_rviz:=true env:=simple_box 
     
      # ACL mapper
      - shell_command:
        - sleep 10
        - ros2 launch global_mapper_ros global_mapper_node.launch.py world_dimensions:="[60.0, 30.0, 10.0]"
        
      # onboard agent NX01
      - shell_command:
        - sleep 10
        - ros2 launch mighty onboard_mighty_benchmark.launch.py x:=2.0 y:=0.0 z:=1.0 yaw:=1.57
      
      - shell_command:
        - sleep 20
        - ros2 launch mighty analyze_info_gain_pcl.launch.py traj_path:=/home/kkondo/code/mighty_ws/src/mighty/benchmark_data/multi_thread/traj_dump/test_simple_box/traj_mighty_N5__sfc_g000.mysco2.csv file_identifier:=temp_test