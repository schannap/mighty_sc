session_name: trajectory_overlay
windows:
  - window_name: main
    layout: tiled
    shell_command_before:
    - source /home/kkondo/code/mighty_ws/install/setup.bash
    - source /home/kkondo/code/decomp_ws/install/setup.bash
    - export ROS_DOMAIN_ID=7
    panes:
      # base station
      - shell_command:
        - source /usr/share/gazebo/setup.bash
        - ros2 launch mighty base_mighty.launch.py use_dyn_obs:=false use_gazebo_gui:=false use_rviz:=true env:=big_obstacle #env:=hard_forest
     
      # ACL mapper
      - shell_command:
        - sleep 10
        - ros2 launch global_mapper_ros global_mapper_node.launch.py world_dimensions:="[60.0, 30.0, 10.0]"
        
      # onboard agent NX01
      - shell_command:
        - sleep 10
        - ros2 launch mighty onboard_mighty.launch.py x:=11.0 y:=0.0 z:=1.0 yaw:=1.57 initial_wdx:=60.0 initial_wdy:=30.0 initial_wdz:=10.0
      
      # # Overlay node (using benchmakr data csvs)
      # - shell_command:
      #   - sleep 10
      #   - ros2 launch mighty trajectory_overlay.launch.py nominal_dir:=src/mighty/benchmark_data/multi_thread/traj_dump/mighty_N5 modified_dir:=src/mighty/benchmark_data/multi_thread/traj_dump/mighty_N5with_occ_

      - shell_command:
        - sleep 20
        - ros2 launch mighty plot_occlusions.launch.py traj_directory:=src/mighty/benchmark_data/multi_thread/traj_dump/sweep_14 initial_wdx:=60.0 initial_wdy:=30.0 min_wdx:=30.0 min_wdy:=30.0 min_wdz:=10.0