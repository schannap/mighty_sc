session_name: generate_sfc
windows:
  - window_name: main
    layout: tiled
    shell_command_before:
      - export ROS_DOMAIN_ID=7
      - source /home/kkondo/code/mighty_ws/install/setup.bash
      - source /home/kkondo/code/decomp_ws/install/setup.bash
    panes:

      # base station
      - shell_command:
        - source /usr/share/gazebo/setup.bash
        - ros2 launch mighty base_mighty.launch.py use_dyn_obs:=false use_gazebo_gui:=false use_rviz:=true env:=big_obstacle #env:=hard_forest
     

      # ACL mapper
      - shell_command:
        - sleep 10
        - ros2 launch global_mapper_ros global_mapper_node.launch.py world_dimensions:="[60.0, 30.0, 10.0]"

      # onboard agent NX01
      - shell_command:
        - sleep 10
        - ros2 launch mighty onboard_mighty.launch.py x:=11.0 y:=0.0 z:=1.0 yaw:=1.57 initial_wdx:=60.0 initial_wdy:=30.0 initial_wdz:=10.0

      # run SFC generator
      - shell_command:
        - sleep 20
        - ros2 run mighty corridor_generator_node --ros-args -p max_dist_vertexes:=6.0 -p start:="[11.0, 0.0, 1.0]" -p goal_x:=18.0 -p wdx:=60.0
        # the goal in x was 27, but something seems wrong when using that number. Trajectories end around x = 20. Set it to 18 for now to see what happens